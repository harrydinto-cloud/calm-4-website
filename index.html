<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calm 4 Music - Home</title>
    <style>
        /* Target the exact DaFont filename for the alternate font */
        @font-face {
            font-family: 'Minecrafter Alt';
            src: url('MineCrafter_Alt.ttf') format('truetype');
        }

        body {
            background-color: #007bff; /* Bright blue background */
            color: #000000; /* Black text */
            font-family: 'Minecrafter Alt', sans-serif;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            letter-spacing: 1px;
        }

        .heading-container {
            margin-bottom: 60px;
        }

        h1, h2 {
            margin: 15px 0;
            font-weight: normal;
        }

        h1 {
            font-size: 2.8rem;
            line-height: 1.4;
        }

        h2 {
            font-size: 2.2rem;
            line-height: 1.5;
        }

        .link-container {
            font-size: 2.5rem;
            line-height: 1.3;
        }

        .link-container a {
            color: #00d2ff; /* Bright cyan/blue link color */
            text-decoration: none;
            cursor: pointer;
        }

        .link-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="heading-container">
        <h1>Hi I am Windows Animate</h1>
        <h2>I made Calm 4 music<br>based on C418's Calm 1 music</h2>
    </div>

    <div class="link-container">
        Play the<br>
        <a href="play.html">music here</a>
    </div>

</body>
</html>
